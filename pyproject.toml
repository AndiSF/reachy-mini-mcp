[project]
name = "reachy-mini-mcp"
version = "0.1.0"
description = "MCP server exposing the Reachy Mini daemon REST API as tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.0,<3",
]

[project.scripts]
reachy-mini-mcp = "reachy_mini_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_mini_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
